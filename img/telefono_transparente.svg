<svg width="320" height="640" viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0830;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#130830;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0420;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A0A40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A0D50;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sombra del telefono -->
  <ellipse cx="160" cy="628" rx="100" ry="12" fill="#7B4FD4" opacity="0.25"/>

  <!-- Cuerpo principal - borde exterior brillante -->
  <rect x="18" y="8" width="284" height="620" rx="44" ry="44"
        fill="none" stroke="#A855F7" stroke-width="3" opacity="0.9" filter="url(#glow)"/>

  <!-- Cuerpo principal -->
  <rect x="20" y="10" width="280" height="616" rx="42" ry="42"
        fill="url(#bodyGrad)" stroke="#7B4FD4" stroke-width="2"/>

  <!-- Borde interior brillante -->
  <rect x="27" y="17" width="266" height="602" rx="38" ry="38"
        fill="none" stroke="#A855F7" stroke-width="1" opacity="0.4"/>

  <!-- Botón encendido derecha -->
  <rect x="298" y="158" width="6" height="65" rx="3"
        fill="#7B4FD4" stroke="#A855F7" stroke-width="1"/>
  <rect x="298" y="159" width="4" height="20" rx="2"
        fill="#C084FC" opacity="0.6"/>

  <!-- Botones volumen izquierda -->
  <rect x="16" y="138" width="6" height="50" rx="3"
        fill="#7B4FD4" stroke="#A855F7" stroke-width="1"/>
  <rect x="16" y="198" width="6" height="50" rx="3"
        fill="#7B4FD4" stroke="#A855F7" stroke-width="1"/>

  <!-- Pantalla -->
  <rect x="30" y="20" width="260" height="596" rx="36" ry="36"
        fill="url(#screenGrad)"/>

  <!-- Notch / isla dinámica -->
  <rect x="108" y="28" width="104" height="24" rx="12"
        fill="#1A0D40" stroke="#7B4FD4" stroke-width="1"/>
  <!-- Camara -->
  <circle cx="196" cy="40" r="5.5" fill="#0D0820" stroke="#5A3A9E" stroke-width="1"/>
  <circle cx="196" cy="40" r="3" fill="#1A0840"/>
  <circle cx="197.5" cy="38.5" r="1" fill="#4B2BA0" opacity="0.8"/>

  <!-- Barra de estado -->
  <text x="52" y="62" font-family="Arial, sans-serif" font-size="11"
        fill="#C084FC" font-weight="bold">9:41</text>
  <!-- Batería -->
  <rect x="222" y="53" width="30" height="13" rx="3"
        fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.8"/>
  <rect x="223" y="54" width="22" height="11" rx="2"
        fill="#25D366" opacity="0.9"/>
  <rect x="252" y="57" width="3" height="5" rx="1.5"
        fill="#A855F7" opacity="0.7"/>
  <!-- Señal -->
  <rect x="198" y="56" width="2" height="11" rx="1" fill="#A855F7" opacity="0.9"/>
  <rect x="202" y="59" width="2" height="8" rx="1" fill="#A855F7" opacity="0.8"/>
  <rect x="206" y="62" width="2" height="5" rx="1" fill="#A855F7" opacity="0.7"/>
  <rect x="210" y="64" width="2" height="3" rx="1" fill="#A855F7" opacity="0.5"/>

  <!-- Header WhatsApp -->
  <rect x="30" y="72" width="260" height="58" fill="url(#headerGrad)"/>
  <!-- Borde inferior del header -->
  <line x1="30" y1="130" x2="290" y2="130" stroke="#7B4FD4" stroke-width="0.8" opacity="0.6"/>
  <!-- Avatar -->
  <circle cx="72" cy="101" r="20" fill="#25D366" filter="url(#glow)"/>
  <text x="72" y="107" text-anchor="middle"
        font-family="Arial Black, sans-serif" font-size="15" fill="#fff" font-weight="900">F</text>
  <!-- Nombre + estado -->
  <text x="102" y="95" font-family="Arial, sans-serif" font-weight="800"
        font-size="13" fill="#E9D5FF">Fluxobots AI</text>
  <circle cx="104" cy="109" r="4" fill="#25D366" filter="url(#glow)"/>
  <text x="112" y="113" font-family="Arial, sans-serif"
        font-size="10" fill="#25D366">En línea</text>
  <!-- Menú dots -->
  <circle cx="254" cy="98" r="2.5" fill="#C084FC"/>
  <circle cx="263" cy="98" r="2.5" fill="#C084FC"/>
  <circle cx="272" cy="98" r="2.5" fill="#C084FC"/>

  <!-- Fondo del chat -->
  <rect x="30" y="130" width="260" height="400" fill="#0A0420"/>

  <!-- Burbuja usuario 1 -->
  <rect x="145" y="142" width="138" height="40" rx="18" rx="18"
        fill="#5B21B6" filter="url(#glow)"/>
  <rect x="145" y="142" width="138" height="40" rx="18"
        fill="none" stroke="#A855F7" stroke-width="0.8" opacity="0.6"/>
  <text x="158" y="158" font-family="Arial" font-size="9.5" fill="#EDE9FE">Hola! Quiero agendar</text>
  <text x="158" y="173" font-family="Arial" font-size="9.5" fill="#EDE9FE">una cita 😊</text>

  <!-- Burbuja bot 1 -->
  <rect x="36" y="194" width="158" height="56" rx="18"
        fill="#1A0D40" stroke="#7B4FD4" stroke-width="1"/>
  <text x="50" y="210" font-family="Arial" font-weight="800"
        font-size="9" fill="#25D366" filter="url(#glow)">Fluxobots AI ✦</text>
  <text x="50" y="225" font-family="Arial" font-size="9" fill="#DDD6FE">Hola! Con gusto.</text>
  <text x="50" y="240" font-family="Arial" font-size="9" fill="#DDD6FE">Elige tu horario:</text>

  <!-- Botones de horario -->
  <rect x="36" y="260" width="96" height="22" rx="11"
        fill="#2D1B69" stroke="#7B4FD4" stroke-width="1"/>
  <text x="84" y="275" text-anchor="middle"
        font-family="Arial" font-size="8.5" fill="#C084FC">Lunes 10am</text>
  <rect x="140" y="260" width="106" height="22" rx="11"
        fill="#2D1B69" stroke="#7B4FD4" stroke-width="1"/>
  <text x="193" y="275" text-anchor="middle"
        font-family="Arial" font-size="8.5" fill="#C084FC">Martes 3pm</text>

  <!-- Burbuja usuario 2 -->
  <rect x="152" y="294" width="130" height="26" rx="13"
        fill="#5B21B6" filter="url(#glow)"/>
  <text x="165" y="311" font-family="Arial" font-size="9" fill="#EDE9FE">Lunes 10am perfecto ✓</text>

  <!-- Burbuja bot confirmación -->
  <rect x="36" y="330" width="190" height="76" rx="18"
        fill="#1A0D40" stroke="#7B4FD4" stroke-width="1"/>
  <text x="50" y="346" font-family="Arial" font-weight="800"
        font-size="9" fill="#25D366">Fluxobots AI ✦</text>
  <text x="50" y="361" font-family="Arial" font-size="9" fill="#DDD6FE">Cita confirmada:</text>
  <!-- Card confirmación -->
  <rect x="46" y="366" width="173" height="33" rx="9"
        fill="#2D1B69" stroke="#A855F7" stroke-width="1"/>
  <text x="58" y="379" font-family="Arial" font-weight="700"
        font-size="8.5" fill="#C084FC">Lunes 19 mayo · 10:00 AM</text>
  <text x="58" y="392" font-family="Arial" font-size="8" fill="#86EFAC">✓ Confirmado</text>

  <!-- Burbuja bot recordatorio -->
  <rect x="36" y="416" width="190" height="38" rx="14"
        fill="#1A0D40" stroke="#7B4FD4" stroke-width="1"/>
  <text x="50" y="432" font-family="Arial" font-weight="800"
        font-size="9" fill="#25D366">Fluxobots AI ✦</text>
  <text x="50" y="447" font-family="Arial" font-size="9" fill="#86EFAC">Recordatorio en 24h. ¡Listo! 🎉</text>

  <!-- Barra inferior chat -->
  <rect x="30" y="530" width="260" height="54" rx="0" fill="#120840"/>
  <line x1="30" y1="530" x2="290" y2="530" stroke="#7B4FD4" stroke-width="0.8" opacity="0.5"/>
  <!-- Input -->
  <rect x="36" y="538" width="184" height="30" rx="15"
        fill="#0A0420" stroke="#5B21B6" stroke-width="1"/>
  <text x="52" y="557" font-family="Arial" font-size="8.5" fill="#7C3AED" opacity="0.8">Escribe un mensaje...</text>
  <!-- Mic -->
  <circle cx="236" cy="553" r="14" fill="#5B21B6" filter="url(#glow)"/>
  <text x="236" y="558" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">🎤</text>
  <!-- Send -->
  <circle cx="258" cy="553" r="14" fill="#25D366" filter="url(#glow)"/>
  <text x="258" y="558" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">➤</text>

  <!-- Home indicator -->
  <rect x="108" y="580" width="104" height="5" rx="2.5"
        fill="#A855F7" opacity="0.7" filter="url(#glow)"/>

  <!-- Reflejo superior del cristal -->
  <path d="M 52 22 Q 160 17 268 22 Q 266 42 160 39 Q 54 42 52 22 Z"
        fill="#ffffff" opacity="0.05"/>

  <!-- Brillo esquina superior izquierda -->
  <circle cx="50" cy="50" r="30" fill="#A855F7" opacity="0.04"/>
</svg>

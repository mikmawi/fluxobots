<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fluxobots – Demo Animado</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0D0A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* Fondo con partículas / grid */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      linear-gradient(180deg, #0D0A1A 0%, #130A28 100%);
  }
  .bg::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#2A1A5A 1px, transparent 1px),
      linear-gradient(90deg, #2A1A5A 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.18;
  }
  .glow1 {
    position: fixed; width: 500px; height: 300px;
    border-radius: 50%; background: #3C1586;
    filter: blur(100px); opacity: 0.18;
    top: -80px; left: 50%; transform: translateX(-50%);
  }
  .glow2 {
    position: fixed; width: 300px; height: 300px;
    border-radius: 50%; background: #1A0A5C;
    filter: blur(80px); opacity: 0.2;
    bottom: 0; right: 0;
  }

  /* Wrapper central */
  .scene {
    position: relative; z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 40px 20px;
  }

  /* Texto lateral */
  .copy {
    max-width: 300px;
    opacity: 0;
    transform: translateX(-30px);
    animation: fadeInLeft 0.8s 0.3s ease forwards;
  }
  .copy .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #7B5EC4;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .copy h1 {
    font-family: 'Syne', sans-serif;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .copy h1 span { color: #7B50E8; }
  .copy p {
    font-size: 15px;
    color: #8B7AAA;
    line-height: 1.7;
    margin-bottom: 28px;
  }
  .tags {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tag {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #3D1584;
    color: #C09AFF;
    font-size: 12px;
    background: #1A0D35;
  }

  /* TELÉFONO */
  .phone-wrap {
    position: relative;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 0.9s 0.1s ease forwards;
  }

  /* Glow debajo del teléfono */
  .phone-wrap::after {
    content: '';
    position: absolute;
    bottom: -30px; left: 50%;
    transform: translateX(-50%);
    width: 180px; height: 30px;
    background: #3D1584;
    filter: blur(24px);
    border-radius: 50%;
    opacity: 0.5;
  }

  .phone {
    width: 280px;
    height: 580px;
    background: #1A1A2E;
    border-radius: 44px;
    border: 1.5px solid #3A3A5C;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #2E2E50 inset,
      0 40px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(61,21,132,0.15);
  }

  /* Botones laterales */
  .btn-power {
    position: absolute; right: -3px; top: 140px;
    width: 4px; height: 55px; border-radius: 3px;
    background: #252545; border: 1px solid #3A3A5C;
  }
  .btn-vol1 {
    position: absolute; left: -3px; top: 120px;
    width: 4px; height: 40px; border-radius: 3px;
    background: #252545; border: 1px solid #3A3A5C;
  }
  .btn-vol2 {
    position: absolute; left: -3px; top: 170px;
    width: 4px; height: 40px; border-radius: 3px;
    background: #252545; border: 1px solid #3A3A5C;
  }

  /* Pantalla */
  .screen {
    position: absolute;
    inset: 8px;
    border-radius: 38px;
    background: #0D0820;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Notch */
  .notch {
    position: absolute; top: 10px;
    left: 50%; transform: translateX(-50%);
    width: 90px; height: 20px;
    background: #1A1A2E;
    border-radius: 10px;
    z-index: 10;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 10px; gap: 4px;
  }
  .notch-cam {
    width: 9px; height: 9px; border-radius: 50%;
    background: #0D0D1A; border: 1px solid #2A2A45;
    position: relative;
  }
  .notch-cam::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 4px; height: 4px; border-radius: 50%;
    background: #1A1A35;
  }

  /* Barra de estado */
  .status-bar {
    height: 44px;
    background: #1A0D35;
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .status-time {
    font-size: 11px; font-weight: 600;
    color: #fff; flex: 1;
  }
  .status-icons {
    display: flex; align-items: center; gap: 5px;
  }
  .battery {
    width: 22px; height: 11px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.5);
    position: relative;
    display: flex; align-items: center; padding: 1px;
  }
  .battery::after {
    content: ''; position: absolute; right: -4px;
    width: 2px; height: 5px; border-radius: 1px;
    background: rgba(255,255,255,0.5);
  }
  .battery-fill {
    width: 80%; height: 100%; border-radius: 1px;
    background: #25D366;
  }

  /* Header WhatsApp */
  .wa-header {
    background: #1A0D35;
    padding: 8px 14px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid #2A1050;
  }
  .back-arrow {
    color: #A070E0; font-size: 18px; line-height: 1;
    cursor: pointer; margin-right: 2px;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #25D366;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
    flex-shrink: 0;
  }
  .contact-info { flex: 1; }
  .contact-name {
    font-size: 13px; font-weight: 600; color: #fff;
    line-height: 1.2;
  }
  .contact-status {
    font-size: 10px; color: #25D366;
  }
  .typing-indicator {
    font-size: 10px; color: #25D366;
    display: none;
  }
  .typing-indicator.active { display: block; }
  .wa-dots {
    display: flex; gap: 4px;
  }
  .wa-dots span {
    width: 4px; height: 4px; border-radius: 50%;
    background: #A070E0;
  }

  /* Chat area */
  .chat {
    flex: 1;
    padding: 10px 10px 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #0D0820;
  }

  /* Burbujas */
  .bubble {
    max-width: 82%;
    padding: 7px 11px;
    border-radius: 14px;
    font-size: 10px;
    line-height: 1.45;
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
    position: relative;
  }
  .bubble.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .bubble.user {
    align-self: flex-end;
    background: #3D1584;
    color: #E8D8FF;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    align-self: flex-start;
    background: #1F1040;
    color: #CCC0F0;
    border: 1px solid #3D1584;
    border-bottom-left-radius: 4px;
  }
  .bubble.bot .sender {
    font-size: 8.5px; font-weight: 700;
    color: #25D366; margin-bottom: 3px;
  }
  .bubble-time {
    font-size: 7.5px; color: #9B7FD8;
    text-align: right; margin-top: 2px;
  }
  .bubble.user .bubble-time { color: #B090E0; }

  /* Burbujas especiales */
  .options-row {
    display: flex; gap: 5px; flex-wrap: wrap;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    align-self: flex-start;
  }
  .options-row.visible {
    opacity: 1; transform: translateY(0);
  }
  .opt-btn {
    padding: 4px 10px;
    border-radius: 12px;
    background: #2A1050;
    border: 1px solid #3D1584;
    color: #C09AFF;
    font-size: 9px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .opt-btn:hover { background: #3D1584; }

  /* Tarjeta de cita confirmada */
  .appt-card {
    background: #2A1050;
    border: 1px solid #4B2BAA;
    border-radius: 8px;
    padding: 5px 8px;
    margin-top: 4px;
  }
  .appt-card .appt-title {
    font-size: 9px; font-weight: 700; color: #C09AFF;
  }
  .appt-card .appt-sub {
    font-size: 8px; color: #9B7FD8; margin-top: 1px;
  }

  /* Dots de typing */
  .typing-bubble {
    align-self: flex-start;
    background: #1F1040;
    border: 1px solid #3D1584;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 8px 12px;
    display: none;
  }
  .typing-bubble.active { display: flex; gap: 4px; align-items: center; }
  .typing-bubble span {
    width: 5px; height: 5px; border-radius: 50%;
    background: #7B5EC4;
    animation: typingDot 1.2s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

  /* Input bar */
  .input-bar {
    background: #150A2A;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .input-field {
    flex: 1; height: 28px;
    background: #0D0820;
    border: 1px solid #3D1584;
    border-radius: 14px;
    padding: 0 12px;
    font-size: 9px; color: #5A4A7A;
    display: flex; align-items: center;
  }
  .send-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: #25D366;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .mic-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: #3D1584;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0;
  }

  /* Home bar */
  .home-bar {
    height: 20px; background: #0D0820;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .home-bar-pill {
    width: 80px; height: 4px; border-radius: 2px;
    background: #3D1584; opacity: 0.6;
  }

  /* Brillo del cristal */
  .glass-shine {
    position: absolute; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
    border-radius: 38px 38px 0 0;
    pointer-events: none; z-index: 20;
  }

  /* Animaciones */
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(30px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInLeft {
    from { opacity:0; transform:translateX(-30px); }
    to   { opacity:1; transform:translateX(0); }
  }
  @keyframes typingDot {
    0%,60%,100% { transform: translateY(0); opacity:0.4; }
    30% { transform: translateY(-4px); opacity:1; }
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(61,21,132,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(61,21,132,0); }
  }

  /* Responsive */
  @media (max-width: 700px) {
    .scene { flex-direction: column; gap: 30px; }
    .copy { max-width: 100%; text-align: center; }
    .copy h1 { font-size: 32px; }
    .tags { justify-content: center; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="glow1"></div>
<div class="glow2"></div>

<div class="scene">

  <!-- Texto lateral -->
  <div class="copy">
    <p class="label">Automatización inteligente</p>
    <h1>Tu negocio<br/><span>nunca</span> duerme</h1>
    <p>Fluxobots atiende, agenda y hace seguimiento por WhatsApp, las 24 horas, los 365 días del año. Sin código. Sin esperas.</p>
    <div class="tags">
      <span class="tag">Medicina</span>
      <span class="tag">Spa &amp; Belleza</span>
      <span class="tag">Restaurantes</span>
      <span class="tag">Hoteles</span>
    </div>
  </div>

  <!-- Teléfono animado -->
  <div class="phone-wrap">
    <div class="phone">
      <div class="btn-power"></div>
      <div class="btn-vol1"></div>
      <div class="btn-vol2"></div>

      <div class="screen">
        <div class="glass-shine"></div>
        <div class="notch"><div class="notch-cam"></div></div>

        <!-- Status bar -->
        <div class="status-bar">
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <div class="battery"><div class="battery-fill"></div></div>
          </div>
        </div>

        <!-- WA Header -->
        <div class="wa-header">
          <span class="back-arrow">‹</span>
          <div class="avatar">F</div>
          <div class="contact-info">
            <div class="contact-name">Fluxobots AI</div>
            <div class="contact-status" id="contact-status">● En línea</div>
            <div class="typing-indicator" id="typing-text">escribiendo...</div>
          </div>
          <div class="wa-dots">
            <span></span><span></span><span></span>
          </div>
        </div>

        <!-- Chat -->
        <div class="chat" id="chat">
          <!-- Typing dots -->
          <div class="typing-bubble" id="typing-bubble">
            <span></span><span></span><span></span>
          </div>
        </div>

        <!-- Input -->
        <div class="input-bar">
          <div class="input-field">Escribe un mensaje...</div>
          <div class="mic-btn">🎤</div>
          <div class="send-btn">➤</div>
        </div>
        <div class="home-bar"><div class="home-bar-pill"></div></div>
      </div>
    </div>
  </div>

</div>

<script>
const chat = document.getElementById('chat');
const typingBubble = document.getElementById('typing-bubble');
const typingText = document.getElementById('typing-text');
const contactStatus = document.getElementById('contact-status');

// Secuencia de mensajes
const messages = [
  { type: 'user', text: 'Hola! Quiero agendar\nuna cita de spa 😊', time: '10:01', delay: 800 },
  { type: 'bot', sender: 'Fluxobots AI', text: '¡Hola! Con mucho gusto.\n¿Para qué servicio deseas\ntu cita?', time: '10:01', delay: 1800 },
  { type: 'options', opts: ['Masaje relajante', 'Facial premium', 'Aromaterapia'], delay: 600 },
  { type: 'user', text: 'Masaje relajante', time: '10:02', delay: 900 },
  { type: 'bot', sender: 'Fluxobots AI', text: 'Excelente elección!\nTenemos estos horarios\ndisponibles:', time: '10:02', delay: 1600 },
  { type: 'options', opts: ['Lunes 10am', 'Martes 3pm', 'Jueves 11am'], delay: 500 },
  { type: 'user', text: 'Jueves 11am perfecto', time: '10:02', delay: 900 },
  { type: 'bot-card', sender: 'Fluxobots AI', text: 'Tu cita está confirmada:', card: { title: 'Jueves 22 mayo · 11:00 AM', sub: 'Masaje relajante · Spa Fluxobots ✓' }, time: '10:03', delay: 1800 },
  { type: 'bot', sender: 'Fluxobots AI', text: 'Te enviaré un recordatorio\n24h antes. ¡Hasta pronto! 🌿', time: '10:03', delay: 1400 },
  { type: 'user', text: 'Perfecto, gracias! 😍', time: '10:03', delay: 700 },
];

let index = 0;

function showTyping(duration) {
  return new Promise(resolve => {
    typingBubble.classList.add('active');
    typingText.classList.add('active');
    contactStatus.style.display = 'none';
    // Scroll
    chat.scrollTop = chat.scrollHeight;
    setTimeout(() => {
      typingBubble.classList.remove('active');
      typingText.classList.remove('active');
      contactStatus.style.display = '';
      resolve();
    }, duration);
  });
}

function createBubble(msg) {
  if (msg.type === 'user') {
    const el = document.createElement('div');
    el.className = 'bubble user';
    el.innerHTML = msg.text.replace(/\n/g,'<br/>') +
      `<div class="bubble-time">${msg.time} ✓✓</div>`;
    return el;
  }
  if (msg.type === 'bot') {
    const el = document.createElement('div');
    el.className = 'bubble bot';
    el.innerHTML = `<div class="sender">${msg.sender}</div>` +
      msg.text.replace(/\n/g,'<br/>') +
      `<div class="bubble-time">${msg.time}</div>`;
    return el;
  }
  if (msg.type === 'bot-card') {
    const el = document.createElement('div');
    el.className = 'bubble bot';
    el.innerHTML = `<div class="sender">${msg.sender}</div>` +
      msg.text.replace(/\n/g,'<br/>') +
      `<div class="appt-card">
        <div class="appt-title">${msg.card.title}</div>
        <div class="appt-sub">${msg.card.sub}</div>
      </div>` +
      `<div class="bubble-time">${msg.time}</div>`;
    return el;
  }
  if (msg.type === 'options') {
    const el = document.createElement('div');
    el.className = 'options-row';
    msg.opts.forEach(o => {
      const btn = document.createElement('div');
      btn.className = 'opt-btn';
      btn.textContent = o;
      el.appendChild(btn);
    });
    return el;
  }
}

async function runSequence() {
  await new Promise(r => setTimeout(r, 1200));

  for (let i = 0; i < messages.length; i++) {
    const msg = messages[i];

    // Typing indicator solo para mensajes del bot
    if (msg.type === 'bot' || msg.type === 'bot-card') {
      await showTyping(msg.delay);
    } else {
      await new Promise(r => setTimeout(r, msg.delay));
    }

    // Insertar burbuja antes del typing bubble
    const el = createBubble(msg);
    chat.insertBefore(el, typingBubble);

    // Animar entrada
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.classList.add('visible');
        chat.scrollTop = chat.scrollHeight;
      });
    });

    // Pausa entre mensajes
    await new Promise(r => setTimeout(r, 400));
  }

  // Reiniciar conversación después de pausa
  await new Promise(r => setTimeout(r, 4000));
  restart();
}

function restart() {
  // Fade out bubbles
  const bubbles = chat.querySelectorAll('.bubble, .options-row');
  bubbles.forEach(b => {
    b.style.transition = 'opacity 0.4s';
    b.style.opacity = '0';
  });
  setTimeout(() => {
    bubbles.forEach(b => b.remove());
    runSequence();
  }, 500);
}

runSequence();
</script>
</body>
</html>

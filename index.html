<script>
    const flecha = document.getElementById('flechaScroll');

    function actualizarFlecha() {
        const cerca = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
        flecha.classList.toggle('oculta', cerca);
    }

    flecha.addEventListener('click', () => {
        window.scrollBy({ top: window.innerHeight * 0.85, behavior: 'smooth' });
    });

    window.addEventListener('scroll', actualizarFlecha);
    actualizarFlecha();
